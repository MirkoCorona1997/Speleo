<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Grotte CSR" />
  <meta name="theme-color" content="#0c1222" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Grotte CSR Sardegna</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #0c1222;
      --card: #151d2e;
      --card2: #1c2639;
      --border: #2a3548;
      --text: #f0f4fa;
      --muted: #8b9bb4;
      --green: #1fa97a;
      --green2: #2dd4a0;
      --blue: #3b9eff;
      --amber: #f5b942;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
      --tab: 58px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); overflow: hidden;
    }
    .view { position: absolute; inset: 0; bottom: calc(var(--tab) + var(--safe-b)); display: none; }
    .view.active { display: block; }
    #map { width: 100%; height: 100%; background: #0c1222; }

    /* Top bar */
    .top-bar {
      position: absolute; top: 0; left: 0; right: 0; z-index: 1000;
      padding: max(10px, var(--safe-t)) 12px 28px;
      background: linear-gradient(to bottom, rgba(12,18,34,0.98) 55%, transparent);
      display: flex; gap: 8px; align-items: center;
    }
    .search-box {
      flex: 1; background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 12px 16px; color: var(--text); font-size: 16px;
      outline: none;
    }
    .search-box::placeholder { color: var(--muted); }
    .icon-btn {
      width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); font-size: 18px;
      display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
    }
    .icon-btn.primary { background: var(--green); border-color: var(--green); }

    /* Filters */
    .filters {
      position: absolute; top: calc(68px + var(--safe-t)); left: 12px; right: 12px; z-index: 999;
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 14px; display: none; flex-wrap: wrap; gap: 10px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    }
    .filters.open { display: flex; }
    .filters select {
      flex: 1; min-width: 130px; background: var(--bg); border: 1px solid var(--border);
      color: var(--text); border-radius: 10px; padding: 10px 12px; font-size: 14px;
    }
    .filters .apply {
      width: 100%; background: var(--green); color: #fff; border: none; border-radius: 12px;
      padding: 12px; font-weight: 700; font-size: 15px; cursor: pointer;
    }

    /* Bottom sheet */
    .sheet {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 1100;
      background: var(--card); border-radius: 24px 24px 0 0;
      max-height: 72vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
      transform: translateY(110%); transition: transform 0.3s cubic-bezier(0.32,0.72,0,1);
      box-shadow: 0 -10px 40px rgba(0,0,0,0.55);
      padding-bottom: var(--safe-b);
    }
    .sheet.open { transform: translateY(0); }
    .sheet-handle {
      width: 40px; height: 4px; background: var(--border); border-radius: 2px;
      margin: 10px auto 6px;
    }
    .sheet-head {
      padding: 4px 20px 14px; display: flex; justify-content: space-between; align-items: flex-start;
      border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--card); z-index: 2;
    }
    .sheet-head h2 { font-size: 19px; font-weight: 800; line-height: 1.25; max-width: 78%; letter-spacing: -0.02em; }
    .sheet-head .id-badge {
      display: inline-block; margin-top: 6px; font-size: 12px; font-weight: 600;
      color: var(--green2); background: rgba(31,169,122,0.15); padding: 3px 10px; border-radius: 8px;
    }
    .sheet-actions-top { display: flex; gap: 4px; }
    .sheet-actions-top button {
      background: none; border: none; color: var(--muted); font-size: 26px; cursor: pointer; padding: 4px 6px;
    }
    .sheet-body { padding: 16px 20px 28px; }
    .meta-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px;
    }
    .meta-item {
      background: var(--card2); border-radius: 12px; padding: 12px 14px;
    }
    .meta-item .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; }
    .meta-item .value { font-size: 14px; font-weight: 600; }
    .coords { font-size: 13px; color: var(--muted); margin-bottom: 18px; font-variant-numeric: tabular-nums; }
    .btn-row { display: flex; flex-direction: column; gap: 10px; }
    .btn-row a, .btn-row button {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 15px; border-radius: 14px; font-weight: 700; font-size: 15px;
      text-decoration: none; border: none; cursor: pointer; color: inherit;
    }
    .btn-main { background: var(--green); color: #fff; }
    .btn-sec { background: var(--card2); border: 1px solid var(--border) !important; color: var(--text); }
    .btn-ghost { background: transparent; border: 1.5px solid var(--border) !important; color: var(--muted); font-size: 13px !important; padding: 12px !important; }
    .hint { margin-top: 16px; font-size: 12px; color: var(--muted); line-height: 1.5; text-align: center; }

    /* Status chip */
    .chip {
      position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
      background: rgba(12,18,34,0.92); border: 1px solid var(--border);
      color: var(--muted); padding: 7px 16px; border-radius: 20px; font-size: 12px;
      font-weight: 600; z-index: 900; white-space: nowrap;
    }
    .offline {
      position: absolute; top: max(12px, var(--safe-t)); right: 12px; z-index: 1200;
      background: #c45c1a; color: #fff; font-size: 11px; font-weight: 800;
      padding: 5px 12px; border-radius: 20px; display: none; letter-spacing: 0.04em;
    }
    .offline.show { display: block; }

    /* Tabs */
    .tabs {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 2000;
      height: calc(var(--tab) + var(--safe-b)); padding-bottom: var(--safe-b);
      background: var(--card); border-top: 1px solid var(--border);
      display: flex;
    }
    .tab {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; background: none; border: none; color: var(--muted); font-size: 11px;
      font-weight: 700; cursor: pointer; padding-top: 8px;
    }
    .tab.active { color: var(--green2); }
    .tab .ico { font-size: 22px; line-height: 1; }

    /* Preferiti */
    #view-preferiti {
      background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: max(18px, var(--safe-t)) 16px 24px;
    }
    #view-preferiti h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 4px; }
    #view-preferiti .sub { color: var(--muted); font-size: 14px; margin-bottom: 22px; }
    .empty { text-align: center; padding: 56px 24px; color: var(--muted); }
    .empty .big { font-size: 52px; margin-bottom: 12px; opacity: 0.5; }
    .fav-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 14px 16px; margin-bottom: 10px; display: flex; gap: 12px; align-items: center;
    }
    .fav-card .info { flex: 1; min-width: 0; }
    .fav-card .nome { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fav-card .meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .fav-card .badge {
      font-size: 11px; color: var(--green2); font-weight: 600; margin-top: 4px;
    }
    .fav-btns { display: flex; gap: 6px; flex-shrink: 0; }
    .fav-btns button {
      width: 38px; height: 38px; border-radius: 11px; border: 1px solid var(--border);
      background: var(--card2); color: var(--text); font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .fav-btns button.del { color: #f87171; }

    /* Leaflet tweaks */
    .leaflet-control-zoom { border: none !important; margin-bottom: 20px !important; margin-right: 12px !important; }
    .leaflet-control-zoom a {
      background: var(--card) !important; color: var(--text) !important;
      border: 1px solid var(--border) !important; width: 36px !important; height: 36px !important;
      line-height: 36px !important; font-size: 18px !important;
    }
    .leaflet-control-attribution { font-size: 10px !important; background: rgba(12,18,34,0.7) !important; color: var(--muted) !important; }
  </style>
</head>
<body>
  <div class="offline" id="offlineBadge">OFFLINE</div>

  <div class="view active" id="view-map">
    <div id="map"></div>
    <div class="top-bar">
      <input class="search-box" id="search" type="search" placeholder="Cerca comune o nome…" enterkeyhint="search" />
      <button class="icon-btn" id="filterBtn" title="Filtri">⚙</button>
      <button class="icon-btn primary" id="locateBtn" title="La mia posizione">📍</button>
    </div>
    <div class="filters" id="filters">
      <select id="provinciaFilter">
        <option value="">Tutte le province</option>
        <option value="Sassari">Sassari</option>
        <option value="Nuoro">Nuoro</option>
        <option value="Oristano">Oristano</option>
        <option value="Cagliari">Cagliari</option>
        <option value="Sud Sardegna">Sud Sardegna</option>
      </select>
      <select id="ambitoFilter">
        <option value="">Tutti gli ambiti</option>
        <option value="Sassarese">Sassarese</option>
        <option value="Nuorese">Nuorese</option>
        <option value="Ogliastra">Ogliastra</option>
        <option value="Cagliaritano">Cagliaritano</option>
        <option value="Oristanese">Oristanese</option>
        <option value="Sulcis - Iglesiente">Sulcis - Iglesiente</option>
        <option value="Gallura">Gallura</option>
      </select>
      <button class="apply" id="applyFilters">Applica filtri</button>
    </div>
    <div class="chip" id="status">Caricamento…</div>
  </div>

  <div class="view" id="view-preferiti">
    <h1>Preferiti</h1>
    <p class="sub" id="favCount">0 grotte salvate</p>
    <div id="favList"></div>
  </div>

  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <div>
        <h2 id="sheetTitle">Grotta</h2>
        <span class="id-badge" id="sheetId"></span>
      </div>
      <div class="sheet-actions-top">
        <button id="favBtn" title="Preferiti">☆</button>
        <button id="closeSheet">×</button>
      </div>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>

  <nav class="tabs">
    <button class="tab active" data-view="map"><span class="ico">🗺️</span>Mappa</button>
    <button class="tab" data-view="preferiti"><span class="ico">★</span>Preferiti</button>
  </nav>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
