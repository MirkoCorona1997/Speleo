<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Grotte CSR" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Grotte CSR Sardegna</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --primary: #1a5f4a;
      --primary-light: #2d8a6e;
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --tab-h: 56px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }
    .view { position: absolute; inset: 0; bottom: calc(var(--tab-h) + var(--safe-bottom)); display: none; }
    .view.active { display: block; }
    #map { width: 100%; height: 100%; }

    /* Top bar */
    .top-bar {
      position: absolute; top: 0; left: 0; right: 0; z-index: 1000;
      background: linear-gradient(to bottom, rgba(15,23,42,0.97) 60%, transparent);
      padding: max(12px, env(safe-area-inset-top)) 12px 36px;
      display: flex; gap: 8px; align-items: center;
    }
    .search-box {
      flex: 1; background: var(--card); border: 1px solid #334155;
      border-radius: 12px; padding: 11px 14px; color: var(--text); font-size: 16px;
    }
    .btn {
      background: var(--primary); color: white; border: none; border-radius: 12px;
      padding: 11px 14px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap;
    }
    .btn:active { opacity: 0.85; }
    .btn-secondary { background: #334155; }

    /* Filters */
    .filters {
      position: absolute; top: calc(70px + env(safe-area-inset-top)); left: 12px; right: 12px; z-index: 999;
      background: var(--card); border-radius: 14px; padding: 12px; display: none; flex-wrap: wrap; gap: 8px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    }
    .filters.open { display: flex; }
    .filters select {
      background: #0f172a; border: 1px solid #334155; color: var(--text);
      border-radius: 8px; padding: 9px 10px; font-size: 13px; flex: 1; min-width: 120px;
    }

    /* Bottom sheet panel */
    .panel {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 1100;
      background: var(--card); border-radius: 20px 20px 0 0;
      max-height: 60vh; overflow-y: auto;
      transform: translateY(110%); transition: transform 0.28s ease;
      box-shadow: 0 -8px 30px rgba(0,0,0,0.45);
      padding-bottom: var(--safe-bottom);
    }
    .panel.open { transform: translateY(0); }
    .panel-header {
      padding: 16px 20px 10px; display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #334155; position: sticky; top: 0; background: var(--card); z-index: 1;
    }
    .panel-header h2 { font-size: 17px; font-weight: 700; max-width: 75%; }
    .close-btn, .fav-btn { background: none; border: none; color: var(--muted); font-size: 24px; cursor: pointer; padding: 4px 8px; }
    .fav-btn { font-size: 26px; }
    .panel-body { padding: 12px 20px 28px; }
    .info-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid #1e293b; font-size: 14px; }
    .info-row span:first-child { color: var(--muted); }
    .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
    .actions a, .actions button {
      display: block; text-align: center; padding: 14px; border-radius: 12px;
      font-weight: 600; text-decoration: none; font-size: 15px; border: none; cursor: pointer; color: inherit;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-outline { background: transparent; border: 2px solid var(--primary) !important; color: var(--primary-light); }

    /* Status */
    .status {
      position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
      background: rgba(15,23,42,0.92); color: var(--muted); padding: 6px 14px;
      border-radius: 20px; font-size: 12px; z-index: 900; white-space: nowrap;
    }
    .offline-badge {
      position: absolute; top: max(12px, env(safe-area-inset-top)); right: 12px; z-index: 1200;
      background: #b45309; color: #fff; font-size: 11px; font-weight: 700;
      padding: 4px 10px; border-radius: 20px; display: none;
    }
    .offline-badge.show { display: block; }

    /* Tab bar */
    .tab-bar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 2000;
      height: calc(var(--tab-h) + var(--safe-bottom));
      padding-bottom: var(--safe-bottom);
      background: var(--card); border-top: 1px solid #334155;
      display: flex; align-items: stretch;
    }
    .tab {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; background: none; border: none; color: var(--muted); font-size: 11px; font-weight: 600;
      cursor: pointer; padding-top: 6px;
    }
    .tab.active { color: var(--primary-light); }
    .tab .icon { font-size: 22px; line-height: 1; }

    /* Preferiti view */
    #view-preferiti {
      background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: max(16px, env(safe-area-inset-top)) 16px 24px;
    }
    #view-preferiti h1 {
      font-size: 24px; font-weight: 800; margin-bottom: 4px;
    }
    #view-preferiti .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
    .fav-empty {
      text-align: center; padding: 48px 20px; color: var(--muted);
    }
    .fav-empty .big { font-size: 48px; margin-bottom: 12px; }
    .fav-card {
      background: var(--card); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px;
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }
    .fav-card .info { flex: 1; min-width: 0; }
    .fav-card .nome { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fav-card .meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .fav-card .actions-row { display: flex; gap: 8px; flex-shrink: 0; }
    .fav-card .icon-btn {
      background: #334155; border: none; color: var(--text); width: 40px; height: 40px;
      border-radius: 10px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .fav-card .icon-btn.danger { color: #f87171; }
  </style>
</head>
<body>
  <div class="offline-badge" id="offlineBadge">OFFLINE</div>

  <!-- MAP VIEW -->
  <div class="view active" id="view-map">
    <div id="map"></div>
    <div class="top-bar">
      <input type="text" class="search-box" id="search" placeholder="Cerca nome…" enterkeyhint="search" />
      <button class="btn btn-secondary" id="filterBtn">Filtri</button>
      <button class="btn" id="locateBtn">📍</button>
    </div>
    <div class="filters" id="filters">
      <select id="provinciaFilter">
        <option value="">Tutte le province</option>
        <option value="Sassari">Sassari</option>
        <option value="Nuoro">Nuoro</option>
        <option value="Oristano">Oristano</option>
        <option value="Cagliari">Cagliari</option>
        <option value="Sud Sardegna">Sud Sardegna</option>
      </select>
      <select id="ambitoFilter">
        <option value="">Tutti gli ambiti</option>
        <option value="Sassarese">Sassarese</option>
        <option value="Nuorese">Nuorese</option>
        <option value="Ogliastra">Ogliastra</option>
        <option value="Cagliaritano">Cagliaritano</option>
        <option value="Oristanese">Oristanese</option>
        <option value="Sulcis - Iglesiente">Sulcis - Iglesiente</option>
        <option value="Gallura">Gallura</option>
      </select>
      <button class="btn" id="applyFilters" style="flex:0">Applica</button>
    </div>
    <div class="status" id="status">Caricamento…</div>
  </div>

  <!-- PREFERITI VIEW -->
  <div class="view" id="view-preferiti">
    <h1>Preferiti</h1>
    <p class="subtitle" id="favCount">0 grotte salvate offline</p>
    <div id="favList"></div>
  </div>

  <!-- DETAIL PANEL (shared) -->
  <div class="panel" id="panel">
    <div class="panel-header">
      <h2 id="panelTitle">Grotta</h2>
      <div style="display:flex;align-items:center;gap:4px">
        <button class="fav-btn" id="favBtn" title="Preferiti">☆</button>
        <button class="close-btn" id="closePanel">×</button>
      </div>
    </div>
    <div class="panel-body" id="panelBody"></div>
  </div>

  <!-- TAB BAR -->
  <nav class="tab-bar">
    <button class="tab active" data-view="map" id="tabMap">
      <span class="icon">🗺️</span>
      <span>Mappa</span>
    </button>
    <button class="tab" data-view="preferiti" id="tabPref">
      <span class="icon">★</span>
      <span>Preferiti</span>
    </button>
  </nav>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
